name: Clang Format & Meson Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev 
  workflow_dispatch:

jobs:
  clang-format-checking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install clang-format-16 and colordiff
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-16 colordiff

      - name: Check formatting
        run: |
          files=$(find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \))

          if [ -z "$files" ]; then
            echo "No C/C++ files found."
            exit 0
          fi

          failed=0
          for f in $files; do
            diff_output=$(diff -u "$f" <(clang-format-16 -style=file "$f") || true)
            if [ -n "$diff_output" ]; then
              echo "File $f is not properly formatted:"
              echo "$diff_output" | colordiff | cat
              failed=1
            fi
          done

          if [ $failed -eq 1 ]; then
            echo "Some files are not properly formatted. Run clang-format-16 locally to fix."
            exit 1
          fi

  meson-build-check:
    runs-on: ubuntu-latest
    needs: clang-format-checking
    env:
      PZTEST_PIN: 2a54f8d02cd3964ec4e0d86b134a37cf9467ff4e
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson g++ cmake pkg-config python3 grep
      
      - name: Cache large test corpora
        uses: actions/cache@v4
        with:
          path: test/pz-test
          key: pztest-${{env.PZTEST_PIN}}

      - name: Pull large test corpora
        run: |
          chmod +x ./scripts/setup_testdata.sh
          ./scripts/setup_testdata.sh

      - name: Configure Meson build
        run: |
          meson setup builddir --buildtype=debug -Dcpp_std=c++17 -Dtests=enabled

      - name: Compile project
        run: |
          meson compile -C builddir

      - name: Run tests via Meson
        run: |
          meson test -C builddir --print-errorlogs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tester-results
          path: builddir/meson-logs/testlog.junit.xml
          if-no-files-found: warn 